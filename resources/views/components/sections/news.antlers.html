{{ posts = {collection:posts limit="3" sort="date:desc"} }}

<section id="news" class="scroll-mt-13 py-16 md:py-24">
  <div class="max-w-6xl mx-auto px-6">
    {{ partial:components/layout/brand-stripe class="mb-2" }}
    <p class="text-sm font-semibold text-brand-green mb-4">
      {{ "News & Stories" | trans }}
    </p>
    <h2 class="text-4xl font-semibold tracking-tight mb-8">
      {{ "AMP5 in der Praxis" | trans }}
    </h2>
    {{ if posts }}
      <div class="grid md:grid-cols-3 gap-6">
        {{ posts }}
          {{ partial:components/posts/teaser }}
        {{ /posts }}
      </div>
    {{ /if }}
  </div>
</section>
